<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宝箱</title>
<style>
  /* ============================================================
     宝箱 — 4桁ダイヤル錠
     ============================================================ */

  :root {
    --bg:        #000000;
    --ray-red:   #d4102f;
    --ray-yellow:#f2d200;

    --lock-face: #1d6076;
    --lock-edge: #16404f;
    --lock-dark: #123441;
    --shackle:   #3e4448;

    --strip-hi:  #ffffff;
    --strip-mid: #d9dcdd;
    --strip-lo:  #b9bdbf;

    --item-h: clamp(56px, 13vw, 88px);
    --dial-w: clamp(48px, 11.5vw, 78px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    overscroll-behavior: none;
  }

  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow-x: hidden;
  }

  /* ---------- 集中線 ---------- */
  .rays {
    position: fixed;
    inset: -25%;
    z-index: 0;
    pointer-events: none;
    background: repeating-conic-gradient(from 0deg,
      transparent 0deg 2.1deg,
      var(--ray-red) 2.1deg 3.3deg,
      transparent 3.3deg 6.4deg,
      var(--ray-yellow) 6.4deg 7.2deg,
      transparent 7.2deg 11.5deg);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 14%, #000 34%, #000 62%, transparent 78%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 14%, #000 34%, #000 62%, transparent 78%);
    opacity: .85;
    animation: spin 90s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rays.burst { animation: spin 90s linear infinite, burst .7s ease-out; }
  @keyframes burst {
    0%   { opacity: .85; filter: brightness(1); }
    30%  { opacity: 1;   filter: brightness(2.4); }
    100% { opacity: .85; filter: brightness(1); }
  }

  /* ---------- シーン ---------- */
  .scene {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    display: grid;
    place-items: center;
  }
  .scene[hidden] { display: none; }

  /* ---------- 錠前 ---------- */
  .lock { position: relative; }

  .shackle {
    width: clamp(96px, 24vw, 150px);
    height: clamp(70px, 17vw, 110px);
    margin: 0 auto -10px;
    border: clamp(16px, 4vw, 26px) solid var(--shackle);
    border-bottom: none;
    border-radius: clamp(48px, 12vw, 75px) clamp(48px, 12vw, 75px) 0 0;
    transform-origin: 88% 100%;
    transition: transform .55s cubic-bezier(.34, 1.56, .64, 1);
  }
  .lock.open .shackle { transform: translateY(-26px) rotate(28deg); }

  .body {
    position: relative;
    background: var(--lock-face);
    border: 4px solid var(--lock-edge);
    border-radius: 26px;
    padding: clamp(18px, 4vw, 28px) clamp(14px, 3.5vw, 26px) clamp(76px, 17vw, 104px);
    box-shadow: 0 0 0 2px #000, 0 18px 50px rgba(0,0,0,.75);
  }

  /* 四隅のブラケット */
  .body::before, .body::after {
    content: "";
    position: absolute;
    width: 34px; height: 34px;
    border: 7px solid var(--lock-dark);
  }
  .body::before { top: 10px;    left: 10px;  border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .body::after  { bottom: 10px; right: 10px; border-left: none;  border-top: none;    border-radius: 0 0 12px 0; }

  /* ---------- ダイヤル ---------- */
  .dials {
    display: flex;
    gap: clamp(5px, 1.4vw, 10px);
    justify-content: center;
  }

  .dial {
    position: relative;
    width: var(--dial-w);
    background: var(--lock-dark);
    border-radius: 6px;
    padding: 4px;
    touch-action: none;
    outline: none;
  }
  .dial:focus-visible { box-shadow: 0 0 0 3px var(--ray-yellow); }

  .window {
    position: relative;
    height: calc(var(--item-h) * 3);
    overflow: hidden;
    border-radius: 3px;
    background: linear-gradient(180deg,
      var(--strip-lo)  0%,
      var(--strip-mid) 12%,
      var(--strip-hi)  50%,
      var(--strip-mid) 88%,
      var(--strip-lo) 100%);
    cursor: grab;
  }
  .window:active { cursor: grabbing; }

  /* 中央のくぼみと陰影 */
  .window::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 20%,
                              rgba(0,0,0,0) 80%, rgba(0,0,0,.42) 100%),
      linear-gradient(90deg, rgba(0,0,0,.22) 0%, rgba(255,255,255,.5) 30%,
                             rgba(255,255,255,.5) 70%, rgba(0,0,0,.22) 100%);
  }
  .window::after {
    content: "";
    position: absolute;
    z-index: 3;
    left: 6%; right: 6%;
    top: calc(var(--item-h) - 1px);
    height: calc(var(--item-h) + 2px);
    pointer-events: none;
    border: 3px solid var(--lock-dark);
    border-radius: 8px;
  }

  .strip { will-change: transform; }
  .strip.animate { transition: transform .26s cubic-bezier(.22, .8, .3, 1); }

  .item {
    height: var(--item-h);
    display: grid;
    place-items: center;
    font-size: calc(var(--item-h) * .62);
    font-weight: 800;
    line-height: 1;
    color: var(--lock-dark);
    font-variant-numeric: tabular-nums;
    user-select: none;
    -webkit-user-select: none;
  }

  .arrow {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 3px 0;
    border: none;
    border-radius: 4px;
    background: rgba(255,255,255,.14);
    color: #cfd6d9;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .arrow:hover { background: rgba(255,255,255,.3); color: #fff; }
  .arrow:active { transform: scale(.92); }

  /* ---------- 開錠ボタン ---------- */
  .unlock {
    position: absolute;
    left: 50%;
    bottom: clamp(10px, 2.5vw, 18px);
    transform: translateX(-50%) rotate(-2.2deg);
    padding: clamp(8px, 2vw, 13px) clamp(30px, 8vw, 54px);
    border: 3px solid #000;
    background: #fff;
    color: #000;
    font-size: clamp(19px, 4.6vw, 28px);
    font-weight: 900;
    letter-spacing: .16em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, background .12s ease;
  }
  .unlock:hover { background: var(--ray-yellow); }
  .unlock:active { transform: translateX(-50%) rotate(-2.2deg) scale(.95); }
  .unlock:disabled { opacity: .5; cursor: default; }

  /* ---------- 判定フィードバック ---------- */
  .lock.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translateX(-4px); }
    20%, 80% { transform: translateX(8px); }
    30%, 50%, 70% { transform: translateX(-12px); }
    40%, 60% { transform: translateX(12px); }
  }

  .lock.wrong .body { border-color: var(--ray-red); background: #6b1220; }

  .status {
    min-height: 1.6em;
    margin-top: 18px;
    text-align: center;
    font-size: clamp(14px, 3.6vw, 17px);
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--ray-red);
    text-shadow: 0 2px 10px #000;
    opacity: 0;
    transition: opacity .2s;
  }
  .status.show { opacity: 1; }

  .hint {
    margin-top: 6px;
    text-align: center;
    font-size: clamp(11px, 3vw, 13px);
    color: #7d8488;
    letter-spacing: .06em;
  }

  /* ---------- メッセージ画面 ---------- */
  #messageScene { animation: fadeUp .8s ease-out both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: none; }
  }

  .card {
    max-width: 620px;
    width: 100%;
    padding: clamp(30px, 8vw, 60px) clamp(24px, 6vw, 52px);
    background: rgba(8, 10, 12, .93);
    border: 3px solid var(--ray-yellow);
    border-radius: 18px;
    box-shadow: 0 0 60px rgba(242, 210, 0, .28), 0 24px 60px rgba(0,0,0,.8);
    text-align: center;
  }

  .card .seal {
    font-size: clamp(40px, 12vw, 66px);
    line-height: 1;
    margin-bottom: 18px;
  }

  .card h1 {
    margin: 0 0 22px;
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 900;
    letter-spacing: .1em;
    color: var(--ray-yellow);
  }

  .card .msg {
    margin: 0;
    font-size: clamp(15px, 4.2vw, 19px);
    line-height: 2.05;
    letter-spacing: .05em;
    white-space: pre-wrap;
    text-align: left;
    color: #eef1f2;
  }

  .card .sig {
    margin: 30px 0 0;
    font-size: clamp(13px, 3.4vw, 15px);
    letter-spacing: .12em;
    color: #99a1a5;
  }

  @media (prefers-reduced-motion: reduce) {
    .rays { animation: none; }
    .strip.animate { transition: none; }
    #messageScene { animation: none; }
    .lock.shake { animation: none; }
  }
</style>
</head>
<body>

<div class="rays" id="rays"></div>

<!-- ============ 錠前 ============ -->
<div class="scene" id="lockScene">
  <div>
    <div class="lock" id="lock">
      <div class="shackle"></div>
      <div class="body">
        <div class="dials" id="dials"></div>
        <button class="unlock" id="unlock">開錠</button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="hint">ダイヤルを上下にドラッグ／▲▼／ホイールで数字を合わせる</p>
  </div>
</div>

<!-- ============ メッセージ ============ -->
<div class="scene" id="messageScene" hidden>
  <div class="card">
    <div class="seal">🗝️</div>
    <h1 id="msgTitle"></h1>
    <p class="msg" id="msgBody"></p>
    <p class="sig" id="msgSign"></p>
  </div>
</div>

<script>
/* ==================================================================
   ▼▼▼ ここだけ書き換えれば中身が変わります ▼▼▼
   ================================================================== */
const CONFIG = {
  // 正解の4桁（文字列で、必ず4文字）
  code: "1234",

  // 開錠後の見出し
  title: "開錠成功",

  // 開錠後の本文（改行はそのまま反映されます）
  message: `開錠後のメッセージはここに書く`,

  // 署名（不要なら "" にする）
  signature: "",

  // 不正解のときの表示
  wrongText: "違う — もう一度",
};
/* ==================================================================
   ▲▲▲ 書き換えるのはここまで ▲▲▲
   ================================================================== */


const DIGITS   = 4;
const REPEATS  = 40;                       // 数字列の繰り返し数（無限スクロール用）
const TOTAL    = REPEATS * 10;
const START    = Math.floor(REPEATS / 2) * 10;  // 中央から開始

const dialsEl  = document.getElementById("dials");
const lockEl   = document.getElementById("lock");
const raysEl   = document.getElementById("rays");
const statusEl = document.getElementById("status");
const unlockEl = document.getElementById("unlock");

let solved = false;

/* ---------- ダイヤル生成 ---------- */
const dials = Array.from({ length: DIGITS }, (_, i) => createDial(i));

function createDial(index) {
  const root = document.createElement("div");
  root.className = "dial";
  root.tabIndex = 0;
  root.setAttribute("role", "spinbutton");
  root.setAttribute("aria-label", `${index + 1}桁目`);
  root.setAttribute("aria-valuemin", "0");
  root.setAttribute("aria-valuemax", "9");

  const up = document.createElement("button");
  up.className = "arrow";
  up.type = "button";
  up.textContent = "▲";
  up.setAttribute("aria-label", `${index + 1}桁目を増やす`);

  const win = document.createElement("div");
  win.className = "window";

  const strip = document.createElement("div");
  strip.className = "strip";
  for (let n = 0; n < TOTAL; n++) {
    const item = document.createElement("div");
    item.className = "item";
    item.textContent = n % 10;
    strip.appendChild(item);
  }
  win.appendChild(strip);

  const down = document.createElement("button");
  down.className = "arrow";
  down.type = "button";
  down.textContent = "▼";
  down.setAttribute("aria-label", `${index + 1}桁目を減らす`);

  root.append(up, win, down);
  dialsEl.appendChild(root);

  const dial = { root, win, strip, pos: START };

  /* --- 位置を反映 --- */
  const itemH = () => strip.firstChild.offsetHeight;

  dial.render = (animate, dragOffset = 0) => {
    strip.classList.toggle("animate", !!animate);
    strip.style.transform = `translateY(${(1 - dial.pos) * itemH() + dragOffset}px)`;
    root.setAttribute("aria-valuenow", dial.value());
  };

  dial.value = () => ((dial.pos % 10) + 10) % 10;

  dial.move = (delta) => {
    if (solved) return;
    dial.pos += delta;
    dial.render(true);
    recenterIfNeeded();
    clearStatus();
  };

  // 端に近づいたら見た目そのままで中央へ戻す
  function recenterIfNeeded() {
    if (dial.pos > 20 && dial.pos < TOTAL - 20) return;
    setTimeout(() => {
      const value = dial.value();
      dial.pos = START + (value - (START % 10));
      dial.render(false);
    }, 300);
  }

  /* --- 操作: ▲▼ --- */
  up.addEventListener("click", () => dial.move(-1));
  down.addEventListener("click", () => dial.move(1));

  /* --- 操作: ホイール --- */
  let wheelLock = false;
  win.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    setTimeout(() => (wheelLock = false), 110);
    dial.move(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  /* --- 操作: ドラッグ / スワイプ --- */
  let dragging = false, startY = 0, offset = 0;

  win.addEventListener("pointerdown", (e) => {
    if (solved) return;
    dragging = true;
    startY = e.clientY;
    offset = 0;
    win.setPointerCapture(e.pointerId);
    strip.classList.remove("animate");
  });

  win.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    offset = e.clientY - startY;
    dial.render(false, offset);
  });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    dial.pos += Math.round(-offset / itemH());
    dial.render(true);
    recenterIfNeeded();
    clearStatus();
  };
  win.addEventListener("pointerup", endDrag);
  win.addEventListener("pointercancel", endDrag);

  /* --- 操作: キーボード --- */
  root.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp")        { e.preventDefault(); dial.move(-1); }
    else if (e.key === "ArrowDown") { e.preventDefault(); dial.move(1); }
    else if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      const diff = (Number(e.key) - dial.value() + 10) % 10;
      dial.move(diff);
      const next = dials[index + 1];
      if (next) next.root.focus();
    }
  });

  dial.render(false);
  return dial;
}

// フォント読み込みなどで高さが変わった場合に備えて再計算
window.addEventListener("resize", () => dials.forEach((d) => d.render(false)));
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => dials.forEach((d) => d.render(false)));
}

/* ---------- 判定 ---------- */
function currentCode() {
  return dials.map((d) => d.value()).join("");
}

function clearStatus() {
  statusEl.classList.remove("show");
}

unlockEl.addEventListener("click", () => {
  if (solved) return;

  if (currentCode() === CONFIG.code) {
    open();
  } else {
    statusEl.textContent = CONFIG.wrongText;
    statusEl.classList.add("show");
    lockEl.classList.add("shake", "wrong");
    setTimeout(() => lockEl.classList.remove("shake", "wrong"), 550);
  }
});

function open() {
  solved = true;
  clearStatus();
  unlockEl.disabled = true;
  lockEl.classList.add("open");
  raysEl.classList.add("burst");

  setTimeout(() => {
    document.getElementById("lockScene").hidden = true;

    document.getElementById("msgTitle").textContent = CONFIG.title;
    document.getElementById("msgBody").textContent  = CONFIG.message;

    const sign = document.getElementById("msgSign");
    if (CONFIG.signature) sign.textContent = CONFIG.signature;
    else sign.remove();

    document.getElementById("messageScene").hidden = false;
    document.title = CONFIG.title;
  }, 1100);
}
</script>
</body>
</html>
